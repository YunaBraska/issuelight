define host {
  use                       generic-host
  host_name                 issuelight-live
  alias                     IssueLight live host
  address                   127.0.0.1
  check_command             check_dummy!0!IssueLight live host is up
  max_check_attempts        1
  notifications_enabled     0
}

define service {
  use                       generic-service
  host_name                 issuelight-live
  service_description       IssueLight Critical Service
  display_name              IssueLight Critical Service
  check_command             check_dummy!2!IssueLight live critical
  max_check_attempts        1
  notifications_enabled     0
}

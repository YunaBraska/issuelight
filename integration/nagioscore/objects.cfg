define timeperiod {
    timeperiod_name 24x7
    alias            Every day
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
}

define command {
    command_name check_noop
    command_line /bin/true
}

define contact {
    contact_name                  nagiosadmin
    alias                         IssueLight lab administrator
    host_notifications_enabled    0
    service_notifications_enabled 0
    host_notification_period      24x7
    service_notification_period   24x7
    host_notification_options     n
    service_notification_options  n
    host_notification_commands    check_noop
    service_notification_commands check_noop
}

define host {
    host_name                 issuelight-live
    alias                     IssueLight live host
    address                   127.0.0.1
    check_command             check_noop
    check_period              24x7
    max_check_attempts        1
    check_interval            5
    retry_interval            1
    active_checks_enabled     0
    passive_checks_enabled    1
    notifications_enabled     0
    notification_period       24x7
    contacts                  nagiosadmin
}

define service {
    name                      lab-passive-service
    host_name                 issuelight-live
    service_description       IssueLight Critical Service
    display_name              IssueLight Critical Service
    check_command             check_noop
    check_period              24x7
    max_check_attempts        1
    check_interval            5
    retry_interval            1
    active_checks_enabled     0
    passive_checks_enabled    1
    notifications_enabled     0
    notification_period       24x7
    contacts                  nagiosadmin
}

define service {
    use                       lab-passive-service
    service_description       IssueLight Pending Service
    display_name              IssueLight Pending Service
}

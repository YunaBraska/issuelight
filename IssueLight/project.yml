name: IssueLight

options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
  createIntermediateGroups: true

packages:
  IssueLightCore:
    path: ../Packages/IssueLightCore

targets:
  IssueLight:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: IssueLightCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yunabraska.issuelight
        PRODUCT_NAME: IssueLight
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IssueLight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 IssueLight contributors.
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  IssueLightModelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/IssueLightModel.swift
      - Sources/IssueCountText.swift
    dependencies:
      - package: IssueLightCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yunabraska.issuelight.model-tests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO

schemes:
  IssueLight:
    build:
      targets:
        IssueLight: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - IssueLightModelTests
    archive:
      config: Release

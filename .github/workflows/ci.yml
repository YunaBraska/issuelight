name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate scripts
        run: |
          sh -n scripts/build_release.sh
          sh -n scripts/check_coverage.sh
          sh -n scripts/icinga2_lab.sh
          sh -n scripts/package_release.sh

      - name: Test core
        run: swift test --package-path Packages/IssueLightCore --enable-code-coverage

      - name: Enforce core coverage ratchet
        run: |
          coverage_path=$(swift test \
            --package-path Packages/IssueLightCore \
            --show-codecov-path)
          coverage_profile="$(dirname "$coverage_path")/default.profdata"
          test_binary=$(find Packages/IssueLightCore/.build -type f \
            -path '*/IssueLightCore*Tests.xctest/Contents/MacOS/IssueLightCore*Tests' \
            -print -quit)
          test -n "$test_binary"
          coverage_json="$RUNNER_TEMP/IssueLightCoreCoverage.json"
          xcrun llvm-cov export \
            "$test_binary" \
            -instr-profile="$coverage_profile" \
            -ignore-filename-regex='Tests/|\.build/' \
            -summary-only >"$coverage_json"
          scripts/check_coverage.sh "$coverage_json" 80.9 75.1
          if scripts/check_coverage.sh "$coverage_json" 100 100 >/dev/null 2>&1; then
            echo "Coverage ratchet accepted an impossible threshold." >&2
            exit 1
          fi

      - name: Test app refresh model
        run: |
          xcodebuild test \
            -project IssueLight/IssueLight.xcodeproj \
            -scheme IssueLight \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/IssueLightDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: |
          xcodebuild build \
            -project IssueLight/IssueLight.xcodeproj \
            -scheme IssueLight \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/IssueLightDerivedData" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned release candidate
        run: |
          app_path="$RUNNER_TEMP/IssueLightDerivedData/Build/Products/Release/IssueLight.app"
          release_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app_path/Contents/Info.plist")
          release_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$app_path/Contents/Info.plist")
          sbom_path="$RUNNER_TEMP/IssueLightRelease/IssueLight-$release_version-UNSIGNED.spdx.json"
          scripts/package_release.sh \
            "$app_path" \
            "$RUNNER_TEMP/IssueLightRelease" \
            "$release_version" \
            "$GITHUB_SHA" \
            --allow-unsigned
          test "$(plutil -extract spdxVersion raw "$sbom_path")" = "SPDX-2.3"
          test "$(plutil -extract packages.0.versionInfo raw "$sbom_path")" = \
            "$release_version ($release_build)"
          if scripts/package_release.sh \
            "$app_path" \
            "$RUNNER_TEMP/IssueLightRelease" \
            "$release_version" \
            "$GITHUB_SHA" \
            --allow-unsigned; then
            echo "Packaging overwrote existing artifacts." >&2
            exit 1
          fi
          if scripts/package_release.sh \
            "$app_path" \
            "$RUNNER_TEMP/IssueLightSignedNegative" \
            "$release_version" \
            "$GITHUB_SHA"; then
            echo "Unsigned app passed signed release verification." >&2
            exit 1
          fi
          if scripts/package_release.sh \
            "$app_path" \
            "$RUNNER_TEMP/IssueLightVersionNegative" \
            "$release_version.invalid" \
            "$GITHUB_SHA" \
            --allow-unsigned; then
            echo "Packaging accepted a mismatched version." >&2
            exit 1
          fi

      - name: Reject accidental secrets
        run: |
          test -z "$(find . -type f \( -name '.env.local' -o -name '*.p12' -o -name '*.pfx' -o -name '*.key' \) -not -path './.git/*' -print -quit)"

      - name: Check whitespace
        run: git diff --check

# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release unchanged source.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@1ebb6d9e98930d0ede2aaf9bf0c648010d44d66e
    with:
      force: ${{ inputs.force }}
      macos_update_public_key: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
      app_store_app_name: IssueLight
      app_store_bundle_id: berlin.yuna.issuelight
      release_notes_prefix: |
        ## Compatibility

        - Requires macOS 14 or later.
        - Direct downloads update through the signed IssueLight feed. App Store builds update through Apple.
    secrets: inherit

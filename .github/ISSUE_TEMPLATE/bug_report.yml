name: Bug report
description: Report reproducible incorrect behavior without private monitoring data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials, private hosts, certificates, tokens, or real monitoring payloads.
  - type: input
    id: version
    attributes:
      label: IssueLight version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and version
      placeholder: Icinga 2.16
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use sanitized values and list exact actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

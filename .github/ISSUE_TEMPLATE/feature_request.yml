name: Feature request
description: Propose one observable user outcome.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or task is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: Describe what the user can verify when this is complete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: This proposal contains no credentials, private monitoring data, or personal information.
          required: true
